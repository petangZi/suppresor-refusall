<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Suppresor Refusall by Redz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#12080b"/>
      <stop offset="1" stop-color="#1c070c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.75">
